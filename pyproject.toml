[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-radar"
version = "0.1.0"
description = "Track the external APIs your repository depends on and catch breaking OpenAPI changes before they break production."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "API Radar contributors" }]
requires-python = ">=3.11"
keywords = ["openapi", "breaking-changes", "github-app", "api-monitoring", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
apiradar = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]