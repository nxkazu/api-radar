openapi: 3.0.3
info:
  title: Petstore API
  version: 1.4.0
  description: Demo API used by API Radar's end-to-end example.
servers:
  - url: https://api.petstore.dev/v1
  - url: https://staging.api.petstore.dev/v1
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [available, pending, sold]
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPet
      responses:
        "200":
          description: A pet
          headers:
            X-Rate-Limit:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: Not found
    delete:
      operationId: deletePet
      responses:
        "204":
          description: Deleted
  /v1/owners/{ownerId}:
    parameters:
      - name: ownerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOwnerV1
      responses:
        "200":
          description: An owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
  /store/orders:
    post:
      operationId: createOrder
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewOrder"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Bad request
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        tag:
          type: string
          nullable: true
        status:
          type: string
          enum: [available, pending, sold]
        owner:
          $ref: "#/components/schemas/Owner"
    NewPet:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            microchip:
              type: string
    Order:
      type: object
      required: [id, petId, quantity]
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
    NewOrder:
      type: object
      required: [petId, quantity]
      properties:
        petId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        note:
          type: string
    Owner:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"